<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>K-pop Mood Diary</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- FLOATING GIFS -->
  <img class="gif-corner top-left" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExbTZqZGk3ZzJ4N29zeWI2a3NreHN1c3Q4ZXc1ZHZxMGgzMmZ2NndyZiZlcD12MV9naWZzX3NlYXJjaCZjdD1n/YTbZzCkRQCEJa/giphy.gif" alt="sparkle">
  <img class="gif-corner bottom-right" src="https://media.giphy.com/media/12NUbkX6p4xOO4/giphy.gif" alt="sparkle heart">

  <div class="container">
    <h1>🎀 My K-pop Mood Diary 🎀</h1>
    
    <div class="mood-grid">
      <div class="mood-card" data-mood="💖 Happy"><span>💖</span> Happy</div>
      <div class="mood-card" data-mood="😭 Sad"><span>😭</span> Sad</div>
      <div class="mood-card" data-mood="😤 Angry"><span>😤</span> Angry</div>
      <div class="mood-card" data-mood="✨ Bias Wrecked"><span>✨</span> Bias Wrecked</div>
    </div>

    <textarea id="note" placeholder="Write your feelings like a fanfic confession..."></textarea>
    <button id="save-btn">Save Mood 📝</button>
    <a class="history-link" href="history.html">📚 View Mood History</a>
  </div>

  <script src="script.js"></script>
</body>
</html>
