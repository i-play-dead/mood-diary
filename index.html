<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mood Diary</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1>🌈 How are you feeling today?</h1>
    <div id="mood-buttons">
      <button class="mood">😄</button>
      <button class="mood">😢</button>
      <button class="mood">😠</button>
      <button class="mood">😴</button>
      <button class="mood">🤩</button>
    </div>
    <textarea id="note" placeholder="Write a little something..."></textarea>
    <button id="save-btn">💾 Save Mood</button>

    <h2>📅 Mood History</h2>
    <ul id="history"></ul>
  </main>

  <script src="script.js"></script>
</body>
</html>
