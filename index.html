<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>K-pop Mood Diary</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <audio autoplay loop id="bg-music">
  <source src="https://files.catbox.moe/35bwt0.mp3" type="audio/mpeg">
</audio>

<script>
  window.addEventListener('DOMContentLoaded', () => {
    const music = document.getElementById('bg-music');
    music.play().catch(() => {
      // Wait for user interaction
      document.addEventListener('click', () => {
        music.play();
      }, { once: true });
    });
  });
</script>

  <!-- FLOATING GIFS -->
  <img class="gif-corner top-left" src="https://files.catbox.moe/5oxh61.gif" alt="sparkle">
  <img class="gif-corner bottom-right" src="https://files.catbox.moe/8w8na1.gif" alt="sparkle heart">
  <img class="gif-corner top-right" src="https://yourgifurl.gif" alt="kpop gif">
  <img class="gif-corner bottom-left" src="https://files.catbox.moe/mf4kr0.gif" alt="kpop gif">



  <div class="container">
    <h1>🎀 How are you feeling today? 🎀</h1>
    
    <div class="mood-grid">
      <div class="mood-card" data-mood="💖 Happy"><span>💖</span> Happy</div>
      <div class="mood-card" data-mood="😭 Sad"><span>😭</span> Sad</div>
      <div class="mood-card" data-mood="😤 Angry"><span>😤</span> Angry</div>
      <div class="mood-card" data-mood="✨ Bias Wrecked"><span>✨</span> Bias Wrecked</div>
    </div>

    <textarea id="note" placeholder="Write your feelings like a fanfic confession..."></textarea>
    <button id="save-btn">Save Mood 📝</button>
    <a class="history-link" href="history.html">📚 View Mood History</a>
  </div>
  

  <script src="script.js"></script>
  
<img src="https://yourgif.gif" style="position:fixed; top:10%; left:10%;" class="debug-img" alt="1" />
<img src="https://files.catbox.moe/ldw1zu.gifv" style="position:fixed; top:20%; left:60%;" />
<img src="https://files.catbox.moe/xi7hfa.gif" style="position:fixed; top:50%; left:30%;" />

</body>
</html>
