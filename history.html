<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Mood History</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>🕰 Mood History 🕰</h1>
    <ul id="history-list"></ul>
    <a href="index.html" class="history-link">← Back to Diary</a>
  </div>

  <script>
  <button onclick="clearHistory()" style="margin: 20px; padding: 10px; background: pink; border: none; font-weight: bold; border-radius: 10px; box-shadow: 0 0 5px hotpink;">🧹 Delete Mood History</button>

    const list = document.getElementById('history-list');
    const history = JSON.parse(localStorage.getItem('moodHistory') || '[]');

    if (history.length === 0) {
      list.innerHTML = '<li>No mood entries yet!</li>';
    } else {
      history.reverse().forEach(entry => {
        const li = document.createElement('li');
        li.innerHTML = `<strong>${entry.mood}</strong> - ${entry.note} <br/><small>${entry.date}</small><hr/>`;
        list.appendChild(li);
      });
    }
  <script>
  function clearHistory() {
    if (confirm("Are you sure you want to delete all your mood history? 💔")) {
      localStorage.removeItem('moodHistory');
      location.reload();
    }
  }

  function displayMoodHistory() {
    const history = JSON.parse(localStorage.getItem('moodHistory')) || [];
    const historyList = document.getElementById('historyList');

    if (history.length === 0) {
      historyList.innerHTML = "<p>No mood entries yet. ✨</p>";
      return;
    }

    historyList.innerHTML = "<ul>" + history.map(entry => `<li>${entry}</li>`).join('') + "</ul>";
  }

  displayMoodHistory();
</script>

  </script>
</body>
</html>
