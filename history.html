<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mood History</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>📖 Your Mood History</h1>
    <ul id="history-list"></ul>
    <a href="index.html" class="history-link">⬅️ Back to Diary</a>
  </div>

  <script>
    const list = document.getElementById("history-list");
    const moods = JSON.parse(localStorage.getItem("moodHistory") || "[]");

    if (moods.length === 0) {
      list.innerHTML = "<p>No entries yet!</p>";
    } else {
      moods.forEach(entry => {
        const li = document.createElement("li");
        li.style.listStyle = "none";
        li.style.background = "#fcd5ce";
        li.style.padding = "1rem";
        li.style.margin = "0.5rem 0";
        li.style.borderRadius = "15px";
        li.innerHTML = `<strong>${entry.date}</strong>: ${entry.mood} – ${entry.note}`;
        list.appendChild(li);
      });
    }
  </script>
</body>
</html>
